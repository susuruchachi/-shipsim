<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ShipSim</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a1a2a; color: #d8e6f0; font-family: sans-serif; }
  .box { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(86vw, 460px); text-align: center; line-height: 1.6; }
  h1 { font-size: 20px; margin: 0 0 10px; }
  p { font-size: 14px; color: #9fb8c8; margin: 0 0 16px; }
  button { padding: 12px 28px; font-size: 16px; font-weight: bold; color: #0a1932; background: #00ffcc; border: none; border-radius: 6px; }
</style>
</head>
<body>
<div class="box">
  <h1>🚢 ShipSim に接続できません</h1>
  <p>インターネットにつないでから「再読み込み」を押してください。<br>
     一度開ければ、次からは電波が無くても起動できます。</p>
  <button onclick="location.replace('https://susuruchachi.github.io/-shipsim/')">再読み込み</button>
</div>
</body>
</html>
